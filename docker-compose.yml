services:

  mysql:
    image: mysql:8.0
    container_name: workflowx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: workflowx
    ports:
      - "3307:3306"
    volumes:
      - workflowx-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: workflowx-backend:latest
    container_name: workflowx-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/workflowx
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: workflowx-frontend:latest
    container_name: workflowx-frontend
    command: npm run preview -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"

volumes:
  workflowx-mysql-data: